<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  #map { width: 100%; height: 100vh; }

  .legend {
    background: white;
    padding: 14px 18px;
    border-radius: 10px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.25);

    line-height: 1.8;

    cursor: pointer;
    padding: 2px 0;
    user-select: none;
  }

  .legend-dot {

    border-radius: 50%;
    flex-shrink: 0;
    border: 2px solid white;
    box-shadow: 0 0 3px rgba(0,0,0,0.4);
  }

  .stats-panel {
    background: white;
    padding: 14px 18px;
    border-radius: 10px;

    line-height: 1.7;

    border-bottom: 1px solid #eee;
    padding-bottom: 6px;
  }
  .stats-row {
    display: flex;
    justify-content: space-between;
    gap: 16px;
  }
  .stats-row .label { color: #666; }
  .stats-row .value { font-weight: 600; }

  .overlap-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    flex-shrink: 0;
    background: linear-gradient(135deg, #1e6dd4 50%, #e63946 50%);
    border: 2px solid white;
    box-shadow: 0 0 3px rgba(0,0,0,0.4);
  }

  .db-cluster {

// ── Map setup ──
const map = L.map("map", {
  center: [39.0, -97.0],
  zoom: 5,
  zoomControl: false,
});

L.control.zoom({ position: "topright" }).addTo(map);

L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}@2x.png", {
  attribution: '&copy; <a href="https://carto.com/">CARTO</a> &copy; <a href="https://osm.org/copyright">OSM</a>',
  maxZoom: 19,
}).addTo(map);

// ── SVG circle marker factory ──
function makeIcon(color, radius) {
  radius = radius || 6;
  const size = radius * 2 + 4;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${radius}"
      fill="${color}" fill-opacity="0.8" stroke="white" stroke-width="1.5"/>
  </svg>`;
  return L.divIcon({
    html: svg,
    className: "",
    iconSize: [size, size],
    iconAnchor: [size/2, size/2],
    popupAnchor: [0, -radius],
  });
}

const dbIcon = makeIcon(DB_COLOR);
const sbIcon = makeIcon(SB_COLOR);

// ── Cluster groups ──
function makeClusterGroup(cssClass) {
  return L.markerClusterGroup({
    maxClusterRadius: 45,
    spiderfyOnMaxZoom: true,
    showCoverageOnHover: false,
    iconCreateFunction: function(cluster) {
      const count = cluster.getChildCount();
      let size = count < 20 ? 36 : count < 100 ? 44 : 52;
      return L.divIcon({
        html: "<div style=\"width:" + (size-10) + "px;height:" + (size-10) + "px;line-height:" + (size-10) + "px;\">" + count + "</div>",
        className: "marker-cluster " + cssClass,
        iconSize: L.point(size, size),
      });
    },
  });
}

const dbCluster = makeClusterGroup("db-cluster");
const sbCluster = makeClusterGroup("sb-cluster");

// ── Add markers ──
dbData.forEach(d => {
  const m = L.marker([d.lat, d.lng], { icon: dbIcon });
  m.bindPopup(`<strong style="color:${DB_COLOR}">Dutch Bros</strong><br>${d.street}<br>${d.city}, ${d.state} ${d.zip}`);
  dbCluster.addLayer(m);
});

sbData.forEach(d => {
  const m = L.marker([d.lat, d.lng], { icon: sbIcon });
  m.bindPopup(`<strong style="color:${SB_COLOR}">7 Brew</strong><br>${d.street}<br>${d.city}, ${d.state} ${d.zip}`);
  sbCluster.addLayer(m);
});

map.addLayer(dbCluster);
map.addLayer(sbCluster);

// ── Overlap analysis ──
function countOverlapStates() {
  const dbStates = new Set(dbData.map(d => d.state));
  const sbStates = new Set(sbData.map(d => d.state));
  let overlap = 0;
  dbStates.forEach(s => { if (sbStates.has(s)) overlap++; });
  return { db: dbStates.size, sb: sbStates.size, overlap };
}

function countOverlapCities() {
  const key = d => d.state + ":" + d.city.toLowerCase();
  const dbCities = new Set(dbData.map(key));
  const sbCities = new Set(sbData.map(key));
  let overlap = 0;
  dbCities.forEach(c => { if (sbCities.has(c)) overlap++; });
  return { db: dbCities.size, sb: sbCities.size, overlap };
}

const stateOverlap = countOverlapStates();
const cityOverlap = countOverlapCities();

// ── Legend control ──
const legend = L.control({ position: "bottomleft" });
legend.onAdd = function() {
  const div = L.DomUtil.create("div", "legend");
  div.innerHTML = `
    <h3>Location Map</h3>
    <div class="legend-row" id="toggle-db">
      <span class="legend-dot" style="background:${DB_COLOR}"></span>
      <span>Dutch Bros <strong>(${dbData.length})</strong></span>
    </div>
    <div class="legend-row" id="toggle-sb">
      <span class="legend-dot" style="background:${SB_COLOR}"></span>
      <span>7 Brew <strong>(${sbData.length})</strong></span>
    </div>
  `;
  L.DomEvent.disableClickPropagation(div);
  return div;
};
legend.addTo(map);

// ── Stats panel ──
const stats = L.control({ position: "bottomright" });
stats.onAdd = function() {
  const div = L.DomUtil.create("div", "stats-panel");
  div.innerHTML = `
    <h3>Overlap Analysis</h3>
    <div class="stats-row"><span class="label">States with both:</span><span class="value">${stateOverlap.overlap} of ${Math.max(stateOverlap.db, stateOverlap.sb)}</span></div>
    <div class="stats-row"><span class="label">Cities with both:</span><span class="value">${cityOverlap.overlap}</span></div>
    <div class="stats-row"><span class="label">Dutch Bros states:</span><span class="value">${stateOverlap.db}</span></div>
    <div class="stats-row"><span class="label">7 Brew states:</span><span class="value">${stateOverlap.sb}</span></div>
    <div class="stats-row"><span class="label">Total locations:</span><span class="value">${dbData.length + sbData.length}</span></div>
  `;
  L.DomEvent.disableClickPropagation(div);
  return div;
};
stats.addTo(map);

// ── Toggle layers ──
let dbVisible = true, sbVisible = true;

document.addEventListener("click", function(e) {
  const dbToggle = e.target.closest("#toggle-db");
  const sbToggle = e.target.closest("#toggle-sb");

  if (dbToggle) {
    dbVisible = !dbVisible;
    dbToggle.classList.toggle("disabled", !dbVisible);
    if (dbVisible) map.addLayer(dbCluster); else map.removeLayer(dbCluster);
  }
  if (sbToggle) {
    sbVisible = !sbVisible;
    sbToggle.classList.toggle("disabled", !sbVisible);
    if (sbVisible) map.addLayer(sbCluster); else map.removeLayer(sbCluster);
  }
});
</script>
